name: prana
description: A medical identity app.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  drift: ^2.35.0
  uuid: ^4.6.0
  crypto: ^3.0.7
  sqlcipher_flutter_libs: ^0.7.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_riverpod: ^3.4.3
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
